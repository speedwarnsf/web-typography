name: CI

on:
  push:
    branches: [master, 'codex/release-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build distributables from the engine
        run: npm run build:dist

      - name: Distributables must be tree-shaken clean of the legacy API
        run: |
          if grep -q "smoothRag\|postRenderFix\|shapeRag\|optimizeBreaks" public/go.js public/typeset.min.js public/typeset.esm.js; then
            echo "Quarantined legacy code leaked into a distributable"; exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Craft, spacing, tracking, clipping, lifecycle and accessibility invariants
        run: npm run test:v4

      - name: Production website build
        run: npm run build

      - name: Fresh packed npm consumer and TypeScript contracts
        run: node scripts/v4/verify-package.mjs

      - name: Packed React consumer in three browsers
        run: node scripts/v4/verify-consumer-browser.mjs

      - name: Reject stale consumer previews
        run: node scripts/v4/verify-consumer-identity.mjs

      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeset-acceptance
          path: output/*.json
          retention-days: 14
