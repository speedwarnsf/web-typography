name: CI

on:
  push:
    branches: [master, codex/release-4.0.0]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build distributables from the engine
        run: npm run build:dist

      - name: Distributables must be tree-shaken clean of the legacy API
        run: |
          if grep -q "smoothRag\|postRenderFix\|shapeRag\|optimizeBreaks" public/go.js public/typeset.min.js public/typeset.esm.js; then
            echo "Quarantined legacy code leaked into a distributable"; exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: V4 craft, spacing, promise and accessibility invariants
        run: npm run test:v4

      - name: Production website build
        run: npm run build
