name: CI

on:
  push:
    branches: [master, 'codex/release-*', 'release/**']
  pull_request:

# Least privilege: CI reads the repository and uploads artifacts, nothing else.
permissions:
  contents: read

jobs:
  test:
    # The browser suites are calibrated on macOS: their fixtures are set in
    # Georgia at exact widths, and 4.3's accessibility, copy, visibility and
    # scheduling suites were written against those layouts. Ubuntu has no
    # Georgia, so 10 of 44 suites fail there on the fallback font's breaks
    # and on slower 4x-CPU timing (run 36255458992). Until the fixtures
    # carry their own fonts, CI runs where the suites are calibrated.
    runs-on: macos-15
    # About 33 minutes (run 36294621257); a hang should not hold a macOS
    # runner for the 360-minute default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The ledger's append-only check compares with earlier commits and tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Tarball bytes depend on the zlib of the node that runs npm pack, not on
      # the npm version: setup-node's official builds bundle the zlib that
      # packed 4.2.0 (a node linked to the system zlib packs different bytes).
      # npm is pinned so that every job packs with the same npm.
      - name: The npm that packs release tarballs
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Published artifacts are immutable
        env:
          LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/v4/verify-ledger.mjs
          node scripts/v4/verify-immutable-4.2.mjs
          node scripts/v4/verify-ledger-guards.mjs

      - name: Type check
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.scripts.json

      - name: Candidate build from the engine sources
        run: npm run build:candidate

      - name: The candidate build writes nothing outside output/
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Distributables must be tree-shaken clean of the legacy API
        run: |
          if grep -q "smoothRag\|postRenderFix\|shapeRag\|optimizeBreaks" output/candidate/site/go.js output/candidate/site/typeset.min.js output/candidate/site/typeset.esm.js; then
            echo "Quarantined legacy code leaked into a distributable"; exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Every suite against the candidate built from src (craft, spacing, tracking, clipping, lifecycle, accessibility, loaders, CLI)
        # Checks listed in scripts/v4/speed-calibrated.json follow the
        # machine's speed; on this runner they are reported, not enforced.
        # release-cut enforces them on the calibration machine.
        env:
          TYPESET_HOSTED_RUNNER: '1'
        run: npm run test:v4

      - name: Production website build
        run: npm run build

      - name: Website security (CSP, inert /audit and /dna, fetch proxy, pinned loader, npm audit)
        run: |
          node scripts/site/verify-safe-fetch.mjs
          node scripts/site/verify-site.mjs --audit

      - name: Fresh packed npm consumer and TypeScript contracts
        env:
          TYPESET_DIST: ${{ github.workspace }}/output/candidate/dist
          TYPESET_CANDIDATE: ${{ github.workspace }}/output/candidate
        run: node scripts/v4/verify-package.mjs

      - name: Candidate package in Vitest (jsdom, happy-dom), Jest 30, attw and publint
        run: node scripts/v4/verify-test-runners.mjs

      - name: React 18.2 to latest, Playwright and @types/react installs beside the packed package
        env:
          TYPESET_DIST: ${{ github.workspace }}/output/candidate/dist
        run: node scripts/v4/verify-react-matrix.mjs

      - name: Packed React consumer in three browsers
        run: node scripts/v4/verify-consumer-browser.mjs

      - name: Reject stale consumer previews
        run: node scripts/v4/verify-consumer-identity.mjs

      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typeset-acceptance
          path: output/*.json
          retention-days: 14
