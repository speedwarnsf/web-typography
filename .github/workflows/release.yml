name: Release

# Publishes a version that release-cut.mjs has already cut and committed.
# Push the tag v<version> on the cut commit; this workflow then
#   1. requires the CI workflow to have passed on that exact commit,
#   2. checks that the tagged sources rebuild the ledger-recorded tarball
#      byte for byte (release-check.mjs) and runs every suite against the
#      committed dist (test:release),
#   3. after approval in the npm environment, publishes exactly
#      public/releases/<version>/typeset.us-<version>.tgz with npm trusted
#      publishing (OIDC) and provenance, confirms the registry has the ledger's
#      bytes and an attestation, and creates the GitHub Release with the notes
#      from CHANGELOG.md and the evidence attached.
# A version the maintainer account already published is not published again:
# when npm serves it with the ledger's integrity (scripts/v4/registry-state.mjs)
# the publish job skips npm, checks the registry against the ledger, and
# creates the GitHub Release with notes that say it has no provenance. npm
# serving the version with any other bytes stops the workflow. 4.2.0 and 4.3.0
# were published that way, before trusted publishing was configured.
# workflow_dispatch rehearses steps 1 and 2 on any tag, ending with
# `npm publish --dry-run` (for a version npm already has, the expected
# refusal counts as success); it never publishes or creates a release.
#
# One-time setup on npmjs.com: typeset.us > Settings > Trusted publishing >
# GitHub Actions, repository speedwarnsf/web-typography, workflow release.yml,
# environment npm. See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to rehearse, for example v4.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    # macOS, like CI: test:release runs the browser suites, which are
    # calibrated on macOS's Georgia (see ci.yml).
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag $TAG is not v<version>"; exit 1 ;; esac
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          # The commit every later step verifies; publish uses this commit, not the tag name.
          echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse "$TAG^{commit}")"
          PASSED="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          if [ "$PASSED" -lt 1 ]; then echo "CI has not passed on $SHA; push the commit, wait for CI, then tag."; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Tarball bytes depend on the zlib of the node that runs npm pack, not on
      # the npm version: setup-node's official builds bundle the zlib that
      # packed 4.2.0 (a node linked to the system zlib packs different bytes).
      # npm is pinned so that every job packs with the same npm.
      - name: The npm that packs release tarballs
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: The tag rebuilds the ledger-recorded release byte for byte
        run: node scripts/v4/release-check.mjs --version "${{ steps.version.outputs.version }}" --ref "$TAG"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Every suite against the committed release artifacts
        # Speed-calibrated checks are reported, not enforced, on this runner
        # (scripts/v4/speed-calibrated.json); the cut enforced them.
        env:
          TYPESET_HOSTED_RUNNER: '1'
        run: npm run test:release

      # The maintainer account may have published the ledger's tarball already;
      # npm's dry run refuses an existing version, so ask the registry first.
      # Other bytes under this version on npm fail here, before any approval.
      - name: npm accepts the tarball (dry run), or already serves exactly these bytes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
          EVENT: ${{ github.event_name }}
        run: |
          STATE="$(node scripts/v4/registry-state.mjs --version "$VERSION")" || exit 1
          if [ "$STATE" = published ]; then echo "typeset.us@$VERSION is on npm with the ledger's integrity; the publish job will not publish it again."; exit 0; fi
          if [ "$STATE" != unpublished ]; then echo "Unexpected registry state '$STATE'"; exit 1; fi
          if npm publish "public/releases/$VERSION/typeset.us-$VERSION.tgz" --dry-run --access public --tag "$DIST_TAG" 2> output/npm-dry-run.log; then exit 0; fi
          cat output/npm-dry-run.log
          # A rehearsal on an already published tag ends here, as it should.
          if [ "$EVENT" = "workflow_dispatch" ] && grep -q "cannot publish over the previously published versions" output/npm-dry-run.log; then exit 0; fi
          exit 1

      - name: Keep the evidence with the release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: |
            output/*.json
            output/release-notes.md
          retention-days: 90

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERIFIED: ${{ needs.verify.outputs.sha }}
    steps:
      # The commit the verify job checked, not whatever the tag names after
      # the approval wait: a tag moved meanwhile would publish an unverified
      # tarball whose provenance names the verified commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag still names the verified commit
        run: |
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          NOW="$(git rev-parse "$TAG^{commit}")"
          if [ "$NOW" != "$VERIFIED" ] || [ "$VERIFIED" != "$GITHUB_SHA" ]; then echo "$TAG names $NOW; the verified commit was $VERIFIED (run for $GITHUB_SHA). Not publishing."; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install -g npm@11.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: output

      # Until trusted publishing is configured (docs/OWNER-ACTIONS.md) the
      # maintainer account publishes the ledger-recorded tarball itself. A
      # version npm already serves with the ledger's integrity is left alone
      # and recorded as published by the maintainer; registry-state.mjs fails
      # the job when npm serves the version with other bytes.
      - name: Publish exactly the ledger-recorded tarball, unless the maintainer already did
        id: publish
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          STATE="$(node scripts/v4/registry-state.mjs --version "$VERSION")" || exit 1
          if [ "$STATE" = published ]; then
            echo "typeset.us@$VERSION is already on npm with the ledger's integrity, published by the maintainer account. Not publishing it again; it has no provenance attestation."
            echo "by=maintainer" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATE" != unpublished ]; then echo "Unexpected registry state '$STATE'"; exit 1; fi
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish "public/releases/$VERSION/typeset.us-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
          echo "by=workflow" >> "$GITHUB_OUTPUT"

      # An attestation exists only when this workflow published; a version the
      # maintainer published has none, so the check is skipped, not faked.
      - name: The registry serves the ledger's bytes, with an attestation when this workflow published
        env:
          PUBLISHED_BY: ${{ steps.publish.outputs.by }}
        run: |
          node scripts/v4/verify-ledger.mjs --network
          if [ "$PUBLISHED_BY" = workflow ]; then
            npm view "typeset.us@$VERSION" dist.attestations --json | tee output/npm-attestations.json
            test -s output/npm-attestations.json
          elif [ "$PUBLISHED_BY" = maintainer ]; then
            echo "typeset.us@$VERSION was published by the maintainer account: no provenance attestation exists, so none is checked."
          else
            echo "Unknown publisher '$PUBLISHED_BY'"; exit 1
          fi

      - name: GitHub Release with notes and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_BY: ${{ steps.publish.outputs.by }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          case "$PUBLISHED_BY" in
            workflow) NOTES=--provenance ;;
            maintainer) NOTES=--maintainer ;;
            *) echo "Unknown publisher '$PUBLISHED_BY'"; exit 1 ;;
          esac
          node scripts/v4/release-notes.mjs --version "$VERSION" "$NOTES" --out output/release-notes.md
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" --verify-tag --title "typeset.us $VERSION" --notes-file output/release-notes.md $FLAGS \
            output/*.json "public/releases/$VERSION/typeset.us-$VERSION.tgz"
