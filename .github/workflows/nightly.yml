name: Nightly

# Slower and platform-sensitive checks that do not gate every pull request:
# the committed release artifacts, Gecko's accessibility tree through
# Marionette, runtime budgets, and the ledger's registry cross-check.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Least privilege: CI reads the repository and uploads artifacts, nothing else.
permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # test:release includes verify-recipe-reproduces, which re-packs 4.2.0.
      - name: The npm that packs release tarballs
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Published artifacts match the npm registry
        run: node scripts/v4/verify-ledger.mjs --network

      - name: Every suite against the committed release artifacts
        run: npm run test:release

      - name: README links resolve, and the React/Playwright install matrix
        run: |
          node scripts/v4/verify-docs.mjs --network
          npm run build:candidate
          TYPESET_DIST="$PWD/output/candidate/dist" node scripts/v4/verify-react-matrix.mjs

      - name: Engine accessibility trees, including Gecko through Marionette
        env:
          TYPESET_AX_FIREFOX: '1'
        run: node scripts/v4/verify-release.mjs --only native-ax --timeout 600

      - name: Runtime budgets (Chromium, 4x CPU; times enforced only on the calibration platform)
        run: |
          npm run build:candidate
          TYPESET_DIST="$PWD/output/candidate/dist" node scripts/v4/verify-budgets.mjs --runtime --repeat 3

      - name: Full benchmark
        if: always()
        run: TYPESET_DIST="$PWD/output/candidate/dist" node scripts/v4/bench-v4.mjs --out output/bench-v4.json

      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typeset-nightly
          path: output/*.json
          retention-days: 30
