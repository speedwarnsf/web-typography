name: Integration question
description: How to use Typeset with a framework, CMS, CSP, test runner or build tool.
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Framework, CMS or build tool, with versions
      placeholder: Next.js 16.3 App Router, React 19.2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Typeset version and how it is loaded
      placeholder: typeset.us 4.3.0 from npm, typeset.us/react
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried, and what happened
      description: Code, console errors, and the auditJSON output if composition is involved.
      render: markdown
    validations:
      required: true
