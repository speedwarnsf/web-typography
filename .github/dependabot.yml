# Dependency updates for the repository's tooling and website. The published
# package has no runtime dependencies; esbuild is pinned exactly because
# builds must stay byte-reproducible, so its updates are reviewed by hand
# (a new esbuild changes bundle bytes and needs a recorded reason).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: esbuild
      # tsc writes the .d.ts files in the published tarball (build-recipe's
      # emitDeclarations, run with this checkout's node_modules), and
      # verify-recipe-reproduces and release-check rebuild published releases
      # byte for byte with it. A TypeScript major can change how declarations
      # are written, so it is taken by hand, with a recorded reason and
      # rebuilds of 4.2.0 and 4.3.0 (TypeScript 7, in PR #6, also failed the
      # scripts' type check with TS2554). Minor and patch updates still come
      # in the tooling group, where CI's 4.2.0 rebuild checks them.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      website:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'tailwindcss', '@tailwindcss/*']
      tooling:
        patterns: ['typescript', 'playwright', '@playwright/test', '@types/node']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
